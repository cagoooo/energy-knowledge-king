name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 組出網站檔案
        run: |
          mkdir -p _site
          cp index.html sw.js version.json manifest.webmanifest favicon.svg favicon.ico apple-touch-icon.png og-image.jpg _site/
          cp -r css js assets icons _site/
          touch _site/.nojekyll

      - name: 蓋上版本號（同一個提交重跑部署，版本不變）
        run: |
          VERSION="$(TZ=Asia/Taipei date -d "@$(git log -1 --format=%ct)" +%Y.%m.%d-%H%M)-${GITHUB_SHA::7}"
          python3 .github/stamp_version.py _site "$VERSION"
          if grep -rl '__BUILD_VERSION__' _site; then echo "::error::還有沒蓋到版本號的檔案"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
